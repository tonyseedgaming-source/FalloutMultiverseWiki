<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Items - Fallout Multiverse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <div class="navbar">
    <div class="nav-left">
      <img src="images/FM_Logo.png" class="nav-logo" alt="Fallout Multiverse Logo">
      <span class="nav-title">Fallout Multiverse</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="docs-options.html" class="active">Documentation</a>
      <a href="servers.html">Servers</a>
    </div>
  </div>

  <div class="page-content">
    <div class="home-container">
      <h1>Items</h1>
      <p class="page-intro">Choose a category, then select a subcategory to browse its IDs.</p>

      <div class="item-search">
        <label for="item-search-input">Search items</label>
        <input id="item-search-input" type="search" data-item-search
          placeholder="Search items, IDs, subcategories, or sources">
        <ul class="search-results" data-item-search-results></ul>
      </div>

      <section class="item-categories" data-item-categories>
        <p class="modlist-status" data-items-status>Loading items from the documentation sheet...</p>
        <div class="categories-grid" data-categories-grid></div>
      </section>
    </div>
  </div>

  <script src="modlist.js"></script>
</body>
</html>
