<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fallout Multiverse IDs</title>

</head>
<body class="home">
  <div class="navbar">
    <div class="nav-left">
      <img src="images/FM_Logo.png" class="nav-logo" alt="Fallout Multiverse Logo">
      <span class="nav-title">Fallout Multiverse</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="docs-options.html" class="active">Documentation</a>
      <a href="servers.html">Servers</a>
    </div>
  </div>

  <div class="page-content">
    <div class="home-container">
      <h1>Fallout Multiverse ID List</h1>

      <div class="dashboard">
        <div class="dash-box">
          <h2><a href="items.html">Items</a></h2>

      <h2 class="modlist-title">All Multiverse Mods</h2>
